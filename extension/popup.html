<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TraceVault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">TV</div>
      <h1 class="title">TraceVault</h1>
      <p class="subtitle">Capture evidence instantly</p>
    </div>
    <button id="captureBtn" class="capture-btn">Capture Evidence</button>
    <div id="statusBox" class="status-box hidden">
      <p id="statusText" class="status-text"></p>
    </div>
    <div id="evidenceDetails" class="evidence-details hidden">
      <h3 class="details-title">Captured Metadata</h3>
      <div class="detail-row"><span class="detail-label">URL</span><span id="detailUrl" class="detail-value"></span></div>
      <div class="detail-row"><span class="detail-label">Title</span><span id="detailTitle" class="detail-value"></span></div>
      <div class="detail-row"><span class="detail-label">Time</span><span id="detailTime" class="detail-value"></span></div>
      <div class="detail-row"><span class="detail-label">SHA-256</span><span id="detailHash" class="detail-value hash-value"></span></div>
      <div class="detail-row"><span class="detail-label">Snippet</span><span id="detailSnippet" class="detail-value snippet-value"></span></div>
    </div>
    <div class="footer">TraceVault v1.0 - Hackathon Edition</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
